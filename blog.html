        /* CSS Reset */

            --line-height-normal: 1.5;
            --line-height-relaxed: 1.7;
            --letter-spacing: -0.01em;
            --border-radius: 12px;

            line-height: var(--line-height-tight);
            letter-spacing: var(--letter-spacing);
